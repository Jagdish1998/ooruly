<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

    <meta name="theme-color" content="#08080a">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Yatra — travel guide to India's getaways">

        content="Where to go, how to reach, best months, precautions, and one-tap booking. Starting near Bengaluru.">

        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308080a'/%3E%3Ctext x='6' y='23' font-family='Segoe UI, Arial, sans-serif' font-size='18' font-weight='700' fill='%23f4f4f5'%3Ey%3C/text%3E%3Ccircle cx='23' cy='20' r='3.4' fill='%23ff004f'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308080a'/%3E%3Ctext x='6' y='23' font-family='Segoe UI, Arial, sans-serif' font-size='18' font-weight='700' fill='%23f4f4f5'%3Ey%3C/text%3E%3Ccircle cx='23' cy='20' r='3.4' fill='%23ff004f'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- keepOriginalSource/keep classes so our .theme-icon-* selectors survive FA's SVG swap -->
    <script>
        window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
    </script>
    <script src="https://kit.fontawesome.com/5ad0b15baf.js" crossorigin="anonymous" async></script>

    <script>
        // Apply saved theme before first paint to avoid a flash of the wrong scheme.
        (function () {
            var root = document.documentElement;
            root.classList.add('js');
            try {
                var saved = localStorage.getItem('theme');
                if (saved) root.setAttribute('data-theme', saved);
                else if (window.matchMedia('(prefers-color-scheme: light)').matches)
                    root.setAttribute('data-theme', 'light');
            } catch (e) { /* storage blocked, keep default */ }
        })();
    </script>
</head>

<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div class="scroll-progress" aria-hidden="true"><span id="scroll-bar"></span></div>

    <header class="site-header" id="site-header">
        <div class="container nav-wrap">
            <a href="#/" class="brand" aria-label="Yatra, home">
                <span class="brand-mark">yatra</span>
                <span class="brand-dot" aria-hidden="true"></span>
            </a>

            <nav id="primary-nav" aria-label="Primary">
                <button class="nav-close icon-btn" type="button" aria-label="Close menu">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
                <ul class="nav-links">
                    <li><a href="#/">Home</a></li>
                    <li><a href="#city">City sights</a></li>
                    <li><a href="#cafes">Cafes</a></li>
                    <li><a href="#eats">Eats</a></li>
                    <li><a href="#do">Things to do</a></li>
                    <li><a href="#nearby">Getaways</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <a class="nav-portfolio" href="https://jagdish1998.github.io/portfolio/" target="_blank"
                    rel="noopener noreferrer">By Jagdish Sahoo</a>
                <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
                    <i class="fa-solid fa-sun theme-icon-sun" aria-hidden="true"></i>
                    <i class="fa-solid fa-moon theme-icon-moon" aria-hidden="true"></i>
                </button>
                <button class="icon-btn nav-open" id="nav-open" type="button" aria-label="Open menu"
                    aria-expanded="false" aria-controls="primary-nav">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>
    <div class="nav-backdrop" id="nav-backdrop" hidden></div>

    <main id="main">
        <!-- Views are swapped in by app.js based on the URL hash: #/ is home,
             #/place/<slug> is a getaway, #/city/<slug> is a Bengaluru sight.
             Server-free, refresh-safe on GitHub Pages. -->
        <div id="view"></div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>Yatra — a travel guide, built as a static site.</p>
            <p class="footer-note">
                Booking links open MakeMyTrip; Yatra doesn't process bookings itself.
            </p>
            <p class="footer-note">
                Photos via
                <a href="https://www.pexels.com/" target="_blank" rel="noopener noreferrer">Pexels</a>
                and
                <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>
                (CC&nbsp;BY / CC&nbsp;BY-SA).
            </p>
        </div>
    </footer>

    <button class="to-top" id="to-top" type="button" aria-label="Back to top">
        <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
    </button>

    <script src="data.js"></script>
    <script src="booking.js"></script>
    <script src="app.js"></script>
</body>

</html>
